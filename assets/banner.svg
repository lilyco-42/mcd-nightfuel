<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0e27"/>
      <stop offset="0.55" stop-color="#141c3a"/>
      <stop offset="1" stop-color="#1e2444"/>
    </linearGradient>
    <linearGradient id="cupG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd54d"/>
      <stop offset="1" stop-color="#f5b81a"/>
    </linearGradient>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffb84d" stop-opacity="0.0"/>
      <stop offset="0.5" stop-color="#ffb84d" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffb84d" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <!-- 夜空 -->
  <rect x="0" y="0" width="1200" height="340" fill="url(#sky)"/>

  <!-- 星星 -->
  <g fill="#c9d4f2">
    <circle cx="120" cy="40" r="1.6" opacity="0.8"/>
    <circle cx="260" cy="70" r="1.2" opacity="0.6"/>
    <circle cx="420" cy="36" r="1.8" opacity="0.9"/>
    <circle cx="560" cy="62" r="1.1" opacity="0.5"/>
    <circle cx="700" cy="40" r="1.5" opacity="0.7"/>
    <circle cx="830" cy="70" r="1.2" opacity="0.6"/>
    <circle cx="905" cy="150" r="1.4" opacity="0.55"/>
    <circle cx="1180" cy="200" r="1.3" opacity="0.5"/>
    <circle cx="1140" cy="60" r="1.6" opacity="0.7"/>
    <circle cx="980" cy="30" r="1.2" opacity="0.6"/>
    <circle cx="340" cy="120" r="1.1" opacity="0.45"/>
    <circle cx="150" cy="150" r="1.3" opacity="0.5"/>
  </g>

  <!-- 月亮（弯月，右上） -->
  <g>
    <circle cx="1046" cy="72" r="34" fill="#ffd54d"/>
    <circle cx="1030" cy="62" r="30" fill="#141c3a"/>
  </g>

  <!-- 地平线暖光（凌晨前的天际） -->
  <rect x="0" y="228" width="1200" height="2" fill="url(#horizon)"/>

  <!-- 标题区 -->
  <text x="60" y="106" font-size="46" font-weight="700" fill="#f2f5ff">麦麦深夜补给官</text>
  <text x="62" y="140" font-size="21" fill="#aeb9dd" letter-spacing="2">NightFuel · 把「一夜」当成一个完整决策周期</text>

  <!-- 特性标签 -->
  <g font-size="13">
    <rect x="60" y="158" width="132" height="26" rx="13" fill="#1c2a52" stroke="#33508f" stroke-width="1"/>
    <text x="76" y="175" fill="#8fb0ff">MCP 端到端实测</text>
    <rect x="202" y="158" width="96" height="26" rx="13" fill="#1c2a52" stroke="#33508f" stroke-width="1"/>
    <text x="218" y="175" fill="#8fb0ff">28 项测试</text>
    <rect x="308" y="158" width="118" height="26" rx="13" fill="#1c2a52" stroke="#33508f" stroke-width="1"/>
    <text x="324" y="175" fill="#8fb0ff">零第三方依赖</text>
    <rect x="436" y="158" width="132" height="26" rx="13" fill="#1c2a52" stroke="#33508f" stroke-width="1"/>
    <text x="452" y="175" fill="#8fb0ff">在线 Demo 可玩</text>
  </g>

  <!-- 咖啡杯（标题右侧装饰） -->
  <g>
    <!-- 热气 -->
    <path d="M 905 62 q 5 -8 0 -16" stroke="#7f8fc0" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
    <path d="M 922 58 q 5 -8 0 -16" stroke="#7f8fc0" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M 939 62 q 5 -8 0 -16" stroke="#7f8fc0" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.8"/>
    <!-- 杯身 -->
    <rect x="895" y="80" width="72" height="58" rx="8" fill="url(#cupG)"/>
    <!-- 把手 -->
    <path d="M 967 92 h 10 a 14 14 0 0 1 0 28 h -10" fill="none" stroke="#f5b81a" stroke-width="7" stroke-linecap="round"/>
    <!-- 杯口线 -->
    <rect x="895" y="80" width="72" height="8" rx="4" fill="#e0a410"/>
    <!-- M 标记 -->
    <text x="931" y="118" font-size="26" font-weight="700" fill="#8a5a00" text-anchor="middle">M</text>
  </g>

  <!-- 四阶段时间轴 -->
  <g font-size="14">
    <rect x="60"  y="246" width="270" height="24" rx="4" fill="#ffb84d"/>
    <text x="195" y="263" fill="#3a2a00" text-anchor="middle" font-weight="600">入夜 18:00–21:00</text>
    <rect x="330" y="246" width="360" height="24" rx="4" fill="#7f9cf5"/>
    <text x="510" y="263" fill="#10193a" text-anchor="middle" font-weight="600">续航 21:00–01:00</text>
    <rect x="690" y="246" width="270" height="24" rx="4" fill="#4c5fd7"/>
    <text x="825" y="263" fill="#eef1ff" text-anchor="middle" font-weight="600">深夜 01:00–04:00</text>
    <rect x="960" y="246" width="180" height="24" rx="4" fill="#38b2ac"/>
    <text x="1050" y="263" fill="#042a26" text-anchor="middle" font-weight="600">收尾 04:00–06:00</text>
  </g>

  <!-- 轴刻度 -->
  <g font-size="12" fill="#6f7ca8">
    <text x="60" y="292">18:00</text>
    <text x="330" y="292" text-anchor="middle">21:00</text>
    <text x="690" y="292" text-anchor="middle">01:00</text>
    <text x="960" y="292" text-anchor="middle">04:00</text>
    <text x="1140" y="292" text-anchor="end">06:00</text>
  </g>

  <!-- 底部说明 -->
  <text x="60" y="322" font-size="13" fill="#5d6a94">咖啡因红线 = 目标入睡时间 − 5h 半衰期 · 睡眠负担分 = 咖啡因残留 + 高钠 + 夜宵热量 · 单位：calculate-price 返回「分」</text>
</svg>
